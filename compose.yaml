x-app: &app
  image: payments-service:local
  build:
    context: .
    target: runtime
  environment: &app-env
    API_KEY: ${API_KEY:?Copy .env.example to .env}
    DATABASE_URL: postgresql+asyncpg://payments:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/payments
    RABBITMQ_URL: amqp://payments:${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD}@rabbitmq:5672/
    RETRY_BASE_SECONDS: ${RETRY_BASE_SECONDS:-1}
    OUTBOX_POLL_SECONDS: ${OUTBOX_POLL_SECONDS:-0.5}
    WEBHOOK_TIMEOUT_SECONDS: ${WEBHOOK_TIMEOUT_SECONDS:-10}

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: payments
      POSTGRES_DB: payments
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payments -d payments"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: payments
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD}
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  migrate:
    <<: *app
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    <<: *app
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os,urllib.request; urllib.request.urlopen(urllib.request.Request('http://localhost:8000/health',headers={'X-API-Key':os.environ['API_KEY']}),timeout=3)"
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  consumer:
    <<: *app
    command: ["python", "-m", "app.worker"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  tests:
    image: payments-service-test:local
    build:
      context: .
      target: test
    environment:
      <<: *app-env
      RUN_INTEGRATION: "1"
      TEST_API_URL: http://api:8000
      TEST_WEBHOOK_HOST: tests
    depends_on:
      api:
        condition: service_healthy
      consumer:
        condition: service_started
    profiles: [test]

volumes:
  postgres-data:
  rabbitmq-data:
