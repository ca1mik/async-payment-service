name: Payment service checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: "requirements*.lock"
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pip install --no-deps .
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q -m "not integration"

  compose-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Configure local test credentials
        run: cp .env.example .env
      - name: Build and start the real stack
        run: docker compose up --build --wait --wait-timeout 180
      - name: Build test image
        run: docker compose --profile test build tests
      - name: Test PostgreSQL, RabbitMQ, webhook, retry and DLQ
        run: docker compose --profile test run --rm --use-aliases tests
      - name: Show service state and logs
        if: always()
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail 150
      - name: Stop test stack
        if: always()
        run: docker compose down
